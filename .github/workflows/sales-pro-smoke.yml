name: LandBank Sales Pro smoke check
on:
  push:
    branches: [landbank-v2-foundation]
    paths:
      - 'sales-pro.html'
      - '.github/workflows/sales-pro-smoke.yml'
  pull_request:
    paths:
      - 'sales-pro.html'
      - '.github/workflows/sales-pro-smoke.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile inline Sales Pro JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('sales-pro.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          if(!scripts.length) throw new Error('No inline script found');
          scripts.forEach((src,i)=>{ try { new Function(src); } catch(e) { throw new Error(`Script ${i+1}: ${e.message}`); } });
          console.log(`Compiled ${scripts.length} inline script(s)`);
          NODE
      - name: Check sales markers
        run: |
          grep -q "lb_sales_workspace" sales-pro.html
          grep -q "lb_top_100_to_call" sales-pro.html
          grep -q "lb_refresh_export_values" sales-pro.html
          grep -q "annual_gross_value_base" sales-pro.html
          grep -q "Qualify & Hand Over" sales-pro.html
          grep -q "Why we are calling" sales-pro.html
