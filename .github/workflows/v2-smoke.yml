name: LandBank V2 smoke check

on:
  push:
    branches: [landbank-v2-foundation]
  pull_request:
    branches: [main]

jobs:
  javascript-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scoring engine syntax
        run: node --check lib/scoring.js
      - name: Check V2 inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['v2-live.html', 'v2-app.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
              .map(m => m[1])
              .filter(s => s.trim());
            if (!scripts.length) throw new Error(`No inline script found in ${file}`);
            scripts.forEach((src, i) => {
              try { new Function(src); }
              catch (e) { throw new Error(`${file} inline script ${i + 1} failed to parse: ${e.message}`); }
            });
            console.log(`${file}: parsed ${scripts.length} inline script(s) successfully.`);
          }
          NODE
      - name: Check required LandBank V2 markers
        run: |
          grep -q "lb_frontend_workspace" v2-live.html
          grep -q "lb_dashboard_metrics" v2-live.html
          grep -q "saveRecord" v2-live.html
          grep -q "LandBank V2" v2-live.html
          grep -q "lb_frontend_workspace" v2-app.html
          grep -q "lb_dashboard_metrics" v2-app.html
          grep -q "saveRecord" v2-app.html
          grep -q "logActivity" v2-app.html
          grep -q "renderCallbacks" v2-app.html
          grep -q "LandBank V2" v2-app.html
