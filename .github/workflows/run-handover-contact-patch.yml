name: Run preferred contact UI patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'ui-handover-preferred-contact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-handover-preferred-contact
          fetch-depth: 0
      - name: Patch Sales Pro branch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sales-pro.html')
          s = p.read_text()
          replacements = [
              (
                  "function openRec(id){const r=rows.find(x=>x.opportunity_id===id)||hand.find(x=>x.opportunity_id===id);if(!r)return;current=r;",
                  "async function openRec(id){let r=rows.find(x=>x.opportunity_id===id)||hand.find(x=>x.opportunity_id===id);if(!r)return;try{const pref=await api('lb_qualifications?select=preferred_contact_name,preferred_contact_mobile&opportunity_id=eq.'+encodeURIComponent(id)+'&limit=1');if(pref&&pref[0])r={...r,...pref[0]}}catch(e){}current=r;"
              ),
              (
                  "<h3>Qualification for handover</h3><div class=\"fields\">'+selectBool('qAuth','Authorised decision maker?',r.authorised_decision_maker)",
                  "<h3>Qualification for handover</h3><div class=\"fields\"><div class=\"fld\"><label>Best person to call</label><input id=\"qPreferredName\" value=\"'+val(r.preferred_contact_name)+'\" placeholder=\"Name of preferred contact\"></div><div class=\"fld\"><label>Preferred mobile number</label><input id=\"qPreferredMobile\" inputmode=\"tel\" autocomplete=\"tel\" value=\"'+val(r.preferred_contact_mobile)+'\" placeholder=\"e.g. 07...\"></div>'+selectBool('qAuth','Authorised decision maker?',r.authorised_decision_maker)"
              ),
              (
                  "body={decision_makers:$('qDM').value||null,preferred_contact_time:$('qTime').value||null,authorised_decision_maker:",
                  "body={decision_makers:$('qDM').value||null,preferred_contact_time:$('qTime').value||null,preferred_contact_name:$('qPreferredName').value.trim()||null,preferred_contact_mobile:$('qPreferredMobile').value.trim()||null,authorised_decision_maker:"
              ),
          ]
          for i, (old, new) in enumerate(replacements, 1):
              if old not in s:
                  raise SystemExit(f'Expected Sales Pro pattern {i} not found; refusing partial patch')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and push branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales-pro.html
          git commit -m "Add preferred handover contact fields to Sales Pro"
          git push origin HEAD:ui-handover-preferred-contact
