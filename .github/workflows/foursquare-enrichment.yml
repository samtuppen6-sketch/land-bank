name: LandBank Foursquare enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: landbank-foursquare-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOURSQUARE_OS_ACCESS_TOKEN: ${{ secrets.FOURSQUARE_OS_ACCESS_TOKEN }}
      SUPABASE_URL: https://xdoqclrwdduncjaxtixp.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_XWKfHKR1EdB_P2w1siERDg_37RWY3Nu
      FSQ_BATCH_SIZE: '100'
      FSQ_MAX_BATCHES: '2'
    steps:
      - uses: actions/checkout@v5
      - name: Check Foursquare secret
        id: fsq-secret
        shell: bash
        run: |
          if [ -n "$FOURSQUARE_OS_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Foursquare H3 Hub token is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "FOURSQUARE_OS_ACCESS_TOKEN is not configured; enrichment will be skipped."
          fi
      - uses: actions/setup-python@v6
        if: steps.fsq-secret.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install DuckDB
        if: steps.fsq-secret.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check 'duckdb==1.4.0'
      - name: Run Foursquare OS enrichment
        if: steps.fsq-secret.outputs.ready == 'true'
        run: python scripts/foursquare_enrich.py
